<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Avatar — Vonage + Anam Demo</title>
<script src="https://video.standard.vonage.com/v2/js/opentok.min.js"></script>
<script type="module" src="/static/script.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; min-height: 100vh; }
  .container { max-width: 960px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { font-size: .8rem; color: #888; margin-bottom: 24px; }
  .video-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .video-panel { background: #1a1a1a; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; }
  .video-panel h3 { font-size: .8rem; color: #888; margin-bottom: 8px; }
  .video-panel .video-wrapper { border-radius: 8px; background: #000; overflow: hidden; position: relative; }
  .video-panel .video-wrapper video { width: 100% !important; height: 100% !important; object-fit: cover !important; display: block !important; position: absolute !important; top: 0 !important; left: 0 !important; }
  .video-panel .video-wrapper::after { content: ""; display: block; padding-bottom: 100%; }
  #anam-avatar { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; background: #000; position: absolute; top: 0; left: 0; }
  .controls { margin: 16px 0; text-align: center; }
  button { padding: 12px 32px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; transition: opacity .2s; }
  button.connect { background: #22c55e; color: #fff; }
  button.disconnect { background: #ef4444; color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: .875rem; color: #aaa; text-align: center; }
  .log { margin-top: 12px; max-height: 180px; overflow-y: auto; font-size: .75rem; color: #666; }
  .log div { padding: 2px 0; }
  #subscriberContainer video { max-width: 100%; border-radius: 8px; display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>AI Avatar Assistant</h1>
  <p class="subtitle">Vonage Video + Anam.ai Avatar + Local LLM</p>

  <div class="video-row">
    <div class="video-panel">
      <h3>あなた</h3>
      <div class="video-wrapper" id="userVideoContainer"></div>
    </div>
    <div class="video-panel">
      <h3>AIアバター</h3>
      <div class="video-wrapper" id="avatarContainer">
        <video id="anam-avatar" autoplay playsinline></video>
      </div>
    </div>
  </div>
  <div id="subscriberContainer" style="display:none"></div>

  <div class="controls">
    <button id="connectBtn" class="connect">接続</button>
  </div>
  <div class="status" id="status">切断されています</div>
  <div class="log" id="log"></div>
</div>
</body>
</html>
